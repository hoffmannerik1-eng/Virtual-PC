<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOS — Virtual Operating System</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:#071018;
    color:#eef7ff;
}

button,input,textarea,select{
    font:inherit;
}

button{
    border:0;
    color:inherit;
    cursor:pointer;
}

body{
    user-select:none;
}

/* DESKTOP */

#desktop{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 70% 20%,#17415b 0,#0b1b29 34%,#050a10 75%);
    overflow:hidden;
}

#desktop:before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(69,255,154,.06) 50%,
            transparent 65%
        );
    animation:shine 12s linear infinite;
    pointer-events:none;
}

@keyframes shine{
    to{
        transform:translateX(25%);
    }
}

#desktop:after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(69,255,154,.07);
    filter:blur(70px);
    right:4%;
    top:8%;
    pointer-events:none;
}

/* DESKTOP ICONS */

#icons{
    position:absolute;
    top:20px;
    left:20px;
    display:grid;
    grid-template-columns:repeat(2,88px);
    gap:12px;
    z-index:2;
}

.deskIcon{
    width:88px;
    padding:8px;
    border-radius:12px;
    text-align:center;
    background:transparent;
    color:#fff;
}

.deskIcon:hover{
    background:rgba(255,255,255,.09);
}

.deskIcon .ico{
    font-size:35px;
    display:block;
    margin-bottom:5px;
}

.deskIcon span{
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:block;
}

/* CLOCK */

#clockTop{
    position:absolute;
    right:22px;
    top:18px;
    text-align:right;
    z-index:2;
}

.bigTime{
    font-size:25px;
    font-weight:700;
}

.smallDate{
    font-size:12px;
    color:#9bb0bf;
}

/* TASKBAR */

#taskbar{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;
    height:62px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:19px;
    background:rgba(9,16,24,.76);
    backdrop-filter:blur(22px);
    display:flex;
    align-items:center;
    padding:7px;
    gap:7px;
    z-index:9999;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.tb{
    height:48px;
    min-width:48px;
    border-radius:14px;
    background:rgba(255,255,255,.06);
    display:grid;
    place-items:center;
    font-size:22px;
}

.tb:hover{
    background:rgba(255,255,255,.13);
}

#startBtn{
    background:#45ff9a;
    color:#06130d;
    font-weight:900;
    font-size:25px;
}

.taskApps{
    display:flex;
    gap:6px;
    flex:1;
}

.taskClock{
    min-width:100px;
    text-align:center;
    font-size:12px;
    color:#cfe0ea;
}

.taskUser{
    padding:0 12px;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-weight:800;
    color:#071018;
}

/* START MENU */

#startMenu{
    position:absolute;
    left:12px;
    bottom:82px;
    width:410px;
    max-height:620px;
    overflow:auto;
    border:1px solid rgba(255,255,255,.13);
    border-radius:22px;
    background:rgba(8,15,23,.94);
    backdrop-filter:blur(25px);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    padding:18px;
    z-index:9998;
    display:none;
}

#startMenu.show{
    display:block;
    animation:pop .16s ease;
}

@keyframes pop{
    from{
        opacity:0;
        transform:translateY(10px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
}

.profile b{
    display:block;
}

.muted{
    color:#93a7b5;
    font-size:12px;
}

.search{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    background:#101c27;
    border:1px solid #263745;
    color:#fff;
    outline:none;
    margin:12px 0;
}

.appGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.appBtn{
    padding:10px 5px;
    border-radius:13px;
    background:rgba(255,255,255,.045);
    text-align:center;
    min-height:76px;
}

.appBtn:hover{
    background:rgba(69,255,154,.11);
}

.appBtn .aico{
    font-size:27px;
    display:block;
}

.appBtn small{
    font-size:10px;
}

.menuRow{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.menuRow button{
    flex:1;
    padding:10px;
    border-radius:12px;
    background:#15232f;
}

.green{
    background:#45ff9a !important;
    color:#06130d !important;
    font-weight:800;
}

/* WINDOWS */

.window{
    position:absolute;
    left:13%;
    top:9%;
    width:74%;
    height:76%;
    min-width:340px;
    min-height:240px;
    background:#0c151e;
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    box-shadow:0 35px 90px rgba(0,0,0,.58);
    overflow:hidden;
    z-index:100;
    display:none;
    resize:both;
}

.window.open{
    display:block;
    animation:win .15s ease;
}

@keyframes win{
    from{
        opacity:0;
        transform:scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.titlebar{
    height:46px;
    display:flex;
    align-items:center;
    padding:0 10px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:#0e1923;
    cursor:grab;
}

.titlebar:active{
    cursor:grabbing;
}

.titleText{
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    font-weight:700;
    font-size:13px;
}

.winBtns{
    display:flex;
    gap:5px;
}

.winBtns button{
    width:31px;
    height:28px;
    border-radius:8px;
    background:rgba(255,255,255,.06);
}

.winBtns button:hover{
    background:rgba(255,255,255,.13);
}

.winBtns .x:hover{
    background:#d34d61;
}

.content{
    height:calc(100% - 46px);
    overflow:auto;
    background:#0a131c;
}

.pad{
    padding:18px;
}

.toolbar{
    display:flex;
    gap:7px;
    align-items:center;
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:#0d1822;
}

.toolbar input,
.toolbar select,
.input{
    background:#101e2a;
    border:1px solid #263a49;
    color:#fff;
    border-radius:9px;
    padding:9px 11px;
    outline:none;
}

.toolbar input{
    flex:1;
}

.btn{
    padding:9px 12px;
    border-radius:9px;
    background:#172733;
    border:1px solid #29404f;
}

.btn:hover{
    background:#203442;
}

.grid2{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.grid3{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:12px;
}

.card{
    background:#101c27;
    border:1px solid #223441;
    border-radius:14px;
    padding:14px;
}

/* BROWSER */

.browserHome{
    height:100%;
    display:grid;
    place-items:center;
    background:
        radial-gradient(circle at 50% 25%,#123b3a,#08121b 60%);
}

.browserHero{
    text-align:center;
    width:min(680px,90%);
}

.browserLogo{
    font-size:70px;
}

.browserHero h1{
    font-size:38px;
    margin:5px;
}

.browserHero p{
    color:#8fa4b3;
}

.browserSearch{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.browserSearch input{
    flex:1;
    padding:14px 16px;
    border-radius:13px;
    border:1px solid #2a414e;
    background:#0d1b26;
    color:white;
    outline:none;
}

.browserSearch button{
    padding:0 20px;
    border-radius:13px;
    background:#45ff9a;
    color:#06130d;
    font-weight:800;
}

.quick{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.quick button{
    background:#132531;
    padding:9px 12px;
    border-radius:10px;
}

.browserFrame{
    width:100%;
    height:100%;
    border:0;
    background:#fff;
}

.blocked{
    position:absolute;
    inset:46px 0 0;
    display:none;
    place-items:center;
    background:#0b141d;
    color:white;
    text-align:center;
    padding:25px;
}

.blocked.show{
    display:grid;
}

/* NOTES */

.noteArea{
    width:100%;
    height:100%;
    min-height:300px;
    background:#0b141d;
    color:#eaf5fb;
    border:0;
    outline:0;
    padding:18px;
    font-size:15px;
    resize:none;
}

/* CALCULATOR */

.calc{
    max-width:380px;
    margin:auto;
}

.calcDisplay{
    font-size:32px;
    text-align:right;
    padding:18px;
    background:#071019;
    border-radius:14px;
    margin-bottom:10px;
    min-height:70px;
    overflow:auto;
}

.calcKeys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.calcKeys button{
    height:60px;
    border-radius:13px;
    background:#162632;
    font-size:18px;
}

.calcKeys button:hover{
    background:#223947;
}

.calcKeys .op{
    background:#184331;
    color:#8dffc0;
}

/* TERMINAL */

.terminal{
    font-family:ui-monospace,Consolas,monospace;
    height:100%;
    padding:14px;
    overflow:auto;
    color:#c9ffd9;
    background:#050a0d;
}

.termLine{
    white-space:pre-wrap;
}

.termInput{
    display:flex;
}

.termInput span{
    color:#45ff9a;
}

.termInput input{
    flex:1;
    background:none;
    border:0;
    outline:0;
    color:white;
    font:inherit;
}

/* FILES */

.fileGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(115px,1fr));
    gap:10px;
}

.fileItem{
    padding:15px;
    border-radius:13px;
    background:#101d28;
    border:1px solid #203442;
    text-align:center;
}

.fileItem:hover{
    border-color:#45ff9a;
}

.fileItem .ficon{
    font-size:35px;
}

/* TODO */

.todo{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.todo input{
    flex:1;
}

.todoItem{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px;
    border-bottom:1px solid #20303c;
}

.todoItem.done span{
    text-decoration:line-through;
    color:#71838f;
}

.todoItem span{
    flex:1;
}

.todoItem button{
    background:#182832;
    border-radius:8px;
    padding:5px 8px;
}

/* GAMES */

.gameWrap{
    height:100%;
    display:grid;
    place-items:center;
    padding:15px;
}

.gameCanvas{
    background:#05090d;
    border:1px solid #28404d;
    border-radius:12px;
    max-width:100%;
    max-height:100%;
}

.score{
    font-size:18px;
    font-weight:700;
    text-align:center;
    margin-bottom:8px;
}

.ttt{
    width:min(390px,90%);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.ttt button{
    aspect-ratio:1;
    border-radius:15px;
    background:#12202b;
    font-size:48px;
}

.ttt button:hover{
    background:#1b3443;
}

.mine{
    display:grid;
    grid-template-columns:repeat(10,30px);
    gap:3px;
}

.mine button{
    width:30px;
    height:30px;
    background:#182833;
    border-radius:4px;
    font-size:12px;
}

.mine button.open{
    background:#29414e;
}

.mine button.flag{
    color:#45ff9a;
}

.g2048{
    display:grid;
    grid-template-columns:repeat(4,72px);
    gap:8px;
    padding:10px;
    background:#16232d;
    border-radius:12px;
}

.g2048 div{
    width:72px;
    height:72px;
    border-radius:8px;
    background:#0d171f;
    display:grid;
    place-items:center;
    font-size:22px;
    font-weight:800;
}

.clicker{
    text-align:center;
}

.clickCoin{
    width:190px;
    height:190px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #79ffb5,
            #19b96d 60%,
            #087342
        );
    color:#052314;
    font-size:65px;
    box-shadow:0 18px 45px rgba(69,255,154,.2);
    margin:30px;
}

.clickCoin:active{
    transform:scale(.96);
}

/* PAINT */

.paint{
    display:grid;
    grid-template-columns:50px 1fr;
    height:100%;
}

.paintTools{
    padding:8px;
    background:#101b25;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.paintTools button{
    padding:8px;
    border-radius:8px;
    background:#182a36;
}

.paintTools input{
    width:34px;
}

.paintCanvas{
    background:white;
    touch-action:none;
    cursor:crosshair;
}

/* STORE */

.storeGrid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(190px,1fr));
    gap:12px;
}

.storeCard{
    background:#101d28;
    border:1px solid #223845;
    border-radius:14px;
    padding:14px;
}

.storeCard .storeIcon{
    font-size:42px;
}

.storeCard button{
    margin-top:10px;
    width:100%;
}

/* CALENDAR */

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.day,.dow{
    padding:9px;
    text-align:center;
    border-radius:8px;
}

.dow{
    color:#45ff9a;
    font-weight:800;
}

.day{
    background:#101d28;
}

.day.today{
    outline:2px solid #45ff9a;
}

.empty{
    opacity:.15;
}

/* USERS */

.userList{
    display:grid;
    gap:8px;
}

.userRow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    background:#101d28;
    border-radius:12px;
}

.userRow span{
    flex:1;
}

.userRow button{
    padding:7px 10px;
    border-radius:8px;
    background:#1b2c38;
}

/* SYSTEM */

.sysgrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    padding:13px;
    background:#101d28;
    border-radius:12px;
}

.stat b{
    display:block;
    margin-bottom:4px;
}

/* MUSIC */

.music{
    display:grid;
    place-items:center;
    height:100%;
    text-align:center;
}

.cover{
    width:190px;
    height:190px;
    border-radius:20px;
    display:grid;
    place-items:center;
    background:
        linear-gradient(135deg,#45ff9a,#164e40);
    font-size:75px;
    margin-bottom:18px;
}

/* MOBILE */

@media(max-width:700px){

    #icons{
        grid-template-columns:repeat(4,72px);
    }

    .deskIcon{
        width:72px;
    }

    .window{
        left:2%;
        top:3%;
        width:96%;
        height:84%;
    }

    #startMenu{
        width:94%;
    }

    .taskClock{
        display:none;
    }

    .appGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .grid3,
    .grid2,
    .sysgrid{
        grid-template-columns:1fr;
    }

    .mine{
        grid-template-columns:repeat(10,26px);
    }

    .mine button{
        width:26px;
        height:26px;
    }

    .g2048{
        grid-template-columns:repeat(4,58px);
    }

    .g2048 div{
        width:58px;
        height:58px;
    }
}
</style>
</head>

<body>

<div id="desktop">

    <div id="icons"></div>

    <div id="clockTop">
        <div class="bigTime" id="topTime">00:00</div>
        <div class="smallDate" id="topDate">—</div>
    </div>

    <div id="windows"></div>

    <div id="startMenu"></div>

    <div id="taskbar">

        <button class="tb" id="startBtn">◈</button>

        <div class="taskApps" id="taskApps"></div>

        <div class="taskUser" id="taskUser"></div>

        <div class="taskClock" id="taskClock">
            00:00
        </div>

    </div>

</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

const esc = s =>
    String(s).replace(
        /[&<>"']/g,
        c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
        }[c])
    );

const apps = {

    browser:['🌐','Browser'],
    files:['📁','Dateien'],
    terminal:['⌨️','Terminal'],
    notes:['📝','Notizen'],
    calc:['🧮','Rechner'],
    store:['🛍️','App Store'],
    todo:['✅','Aufgaben'],
    calendar:['📅','Kalender'],
    clock:['⏱️','Uhr'],
    paint:['🎨','Paint'],
    system:['💻','System'],
    users:['👥','Benutzer'],
    music:['🎵','Musik'],

    snake:['🐍','Snake'],
    mines:['💣','Minesweeper'],
    ttt:['⭕','Tic-Tac-Toe'],
    g2048:['🔢','2048'],
    clicker:['🖱️','Clicker'],
    pong:['🏓','Pong']

};

let users =
    JSON.parse(localStorage.getItem('vos_users') || 'null')
    ||
    [
        {
            id:'u1',
            name:'Erik',
            avatar:'E',
            color:'#45ff9a'
        },
        {
            id:'guest',
            name:'Gast',
            avatar:'G',
            color:'#68a9ff'
        }
    ];

let activeId =
    localStorage.getItem('vos_active')
    ||
    users[0].id;

let z = 120;

let windows = {};

let browserHistory = [];

let browserIndex = -1;


/* STORAGE */

function saveUsers(){

    localStorage.setItem(
        'vos_users',
        JSON.stringify(users)
    );

    localStorage.setItem(
        'vos_active',
        activeId
    );

}

function activeUser(){

    return users.find(
        u => u.id === activeId
    ) || users[0];

}

function key(k){

    return 'vos_' + activeId + '_' + k;

}


/* WINDOW SYSTEM */

function openApp(id){

    $('startMenu').classList.remove('show');

    if(windows[id]){

        windows[id].style.display = 'block';

        windows[id].style.zIndex = ++z;

        return;
    }

    const [ico,name] = apps[id];

    const w = document.createElement('section');

    w.className = 'window open';

    w.id = 'win_' + id;

    w.style.zIndex = ++z;

    w.innerHTML =

        '<div class="titlebar">' +

            '<div class="titleText">' +

                '<span>' + ico + '</span>' +

                '<span>' + name + '</span>' +

            '</div>' +

            '<div class="winBtns">' +

                '<button data-min>—</button>' +

                '<button data-max>□</button>' +

                '<button class="x" data-close>✕</button>' +

            '</div>' +

        '</div>' +

        '<div class="content" id="content_' + id + '"></div>';

    $('windows').appendChild(w);

    windows[id] = w;

    w.querySelector('[data-close]').onclick =
        () => closeApp(id);

    w.querySelector('[data-min]').onclick =
        () => w.style.display = 'none';

    w.querySelector('[data-max]').onclick =
        () => toggleMax(w);

    w.addEventListener(
        'mousedown',
        () => w.style.zIndex = ++z
    );

    drag(
        w,
        w.querySelector('.titlebar')
    );

    renderApp(id);

    renderTasks();

}

function closeApp(id){

    if(windows[id]){

        windows[id].remove();

        delete windows[id];

        renderTasks();

    }

}

function toggleMax(w){

    w.classList.toggle('max');

    if(w.classList.contains('max')){

        w.dataset.old =
            JSON.stringify({
                left:w.style.left,
                top:w.style.top,
                width:w.style.width,
                height:w.style.height
            });

        w.style.left = '1%';
        w.style.top = '1%';
        w.style.width = '98%';
        w.style.height = '88%';

    }else{

        let o =
            JSON.parse(
                w.dataset.old || '{}'
            );

        Object.assign(
            w.style,
            o
        );

    }

}

function drag(w,bar){

    let down = false;

    let sx = 0;
    let sy = 0;

    let sl = 0;
    let st = 0;

    bar.addEventListener(
        'mousedown',
        e => {

            if(e.target.closest('button')) return;

            if(w.classList.contains('max')) return;

            down = true;

            sx = e.clientX;
            sy = e.clientY;

            sl = w.offsetLeft;
            st = w.offsetTop;

            w.style.zIndex = ++z;

        }
    );

    window.addEventListener(
        'mousemove',
        e => {

            if(!down) return;

            w.style.left =
                Math.max(
                    0,
                    sl + e.clientX - sx
                ) + 'px';

            w.style.top =
                Math.max(
                    0,
                    st + e.clientY - sy
                ) + 'px';

        }
    );

    window.addEventListener(
        'mouseup',
        () => down = false
    );

}

function normalizeUrl(v){

    v = v.trim();

    if(!v) return '';

    if(/^https?:\/\//i.test(v))
        return v;

    if(
        v.includes(' ') ||
        !v.includes('.')
    ){

        return (
            'https://www.google.com/search?q=' +
            encodeURIComponent(v)
        );

    }

    return 'https://' + v;

}

function browserGo(v){

    const u = normalizeUrl(v);

    if(!u) return;

    const area = $('browserArea');

    $('blocked').classList.remove('show');

    area.innerHTML =

        '<iframe class="browserFrame" ' +
        'id="browserFrame" ' +
        'referrerpolicy="no-referrer" ' +
        'src="' +
        esc(u) +
        '">' +
        '</iframe>';

    $('burl').value = u;

    browserHistory =
        browserHistory.slice(
            0,
            browserIndex + 1
        );

    browserHistory.push(u);

    browserIndex++;

}

function browserStep(dir){

    const n = browserIndex + dir;

    if(
        n < 0 ||
        n >= browserHistory.length
    ) return;

    browserIndex = n;

    const u = browserHistory[n];

    $('browserArea').innerHTML =

        '<iframe class="browserFrame" ' +
        'src="' +
        esc(u) +
        '">' +
        '</iframe>';

    $('burl').value = u;

}


/* FILES */

function appFiles(c){

    let files =
        JSON.parse(
            localStorage.getItem(
                key('files')
            ) || '[]'
        );

    const render = () => {

        files =
            JSON.parse(
                localStorage.getItem(
                    key('files')
                ) || '[]'
            );

        c.innerHTML =

            '<div class="toolbar">' +

                '<button class="btn green" id="newFile">' +
                '＋ Neue Datei' +
                '</button>' +

                '<input id="fileUpload" type="file">' +

                '<button class="btn" id="downloadAll">' +
                'Export' +
                '</button>' +

            '</div>' +

            '<div class="pad">' +

                '<div class="fileGrid">' +

                    files.map(
                        (f,i) =>

                            '<div class="fileItem">' +

                                '<div class="ficon">' +
                                (
                                    f.type === 'image'
                                    ? '🖼️'
                                    : '📄'
                                ) +
                                '</div>' +

                                '<b>' +
                                esc(f.name) +
                                '</b>' +

                                '<div class="muted">' +
                                esc(f.type) +
                                '</div>' +

                                '<button class="btn" ' +
                                'onclick="openVirtualFile(' +
                                i +
                                ')">' +
                                'Öffnen' +
                                '</button>' +

                            '</div>'
                    ).join('') +

                '</div>' +

            '</div>';

        c.querySelector('#newFile').onclick =
            () => {

                let n =
                    prompt(
                        'Dateiname',
                        'Neue Datei.txt'
                    );

                if(n){

                    files.push({
                        name:n,
                        type:'text',
                        text:''
                    });

                    localStorage.setItem(
                        key('files'),
                        JSON.stringify(files)
                    );

                    render();

                }

            };

        c.querySelector('#fileUpload').onchange =
            e => {

                const f =
                    e.target.files[0];

                if(!f) return;

                const r =
                    new FileReader();

                r.onload = () => {

                    files.push({
                        name:f.name,
                        type:
                            f.type.startsWith('image/')
                            ? 'image'
                            : 'text',
                        text:r.result
                    });

                    localStorage.setItem(
                        key('files'),
                        JSON.stringify(files)
                    );

                    render();

                };

                r.readAsDataURL(f);

            };

        c.querySelector('#downloadAll').onclick =
            () => {

                const blob =
                    new Blob(
                        [
                            JSON.stringify(
                                files,
                                null,
                                2
                            )
                        ],
                        {
                            type:
                                'application/json'
                        }
                    );

                const a =
                    document.createElement('a');

                a.href =
                    URL.createObjectURL(blob);

                a.download =
                    'vos-files.json';

                a.click();

            };

    };

    render();

}

function openVirtualFile(i){

    let files =
        JSON.parse(
            localStorage.getItem(
                key('files')
            ) || '[]'
        );

    const f = files[i];

    if(!f) return;

    if(f.type === 'image'){

        const w = window.open();

        if(w)
            w.document.write(
                '<img style="max-width:100%" src="' +
                f.text +
                '">'
            );

    }else{

        const text =
            prompt(
                'Datei bearbeiten:',
                f.text || ''
            );

        if(text !== null){

            f.text = text;

            localStorage.setItem(
                key('files'),
                JSON.stringify(files)
            );

        }

    }

}

function appCalc(c){

    c.innerHTML =

        '<div class="pad calc">' +

            '<div class="calcDisplay" id="cd">' +
            '0' +
            '</div>' +

            '<div class="calcKeys">' +

                [
                    'C','⌫','(',')',
                    '7','8','9','÷',
                    '4','5','6','×',
                    '1','2','3','−',
                    '0','.','=','+'
                ]
                .map(
                    x =>

                        '<button class="' +
                        (
                            /[÷×−+]/.test(x)
                            ? 'op'
                            : ''
                        ) +
                        '" data-k="' +
                        x +
                        '">' +
                        x +
                        '</button>'
                )
                .join('') +

            '</div>' +

        '</div>';

    let s = '';

    const out = () => {

        $('cd').textContent =
            s || '0';

    };

    c.querySelectorAll('[data-k]')
        .forEach(
            b =>

                b.onclick = () => {

                    let k = b.dataset.k;

                    if(k === 'C')
                        s = '';

                    else if(k === '⌫')
                        s = s.slice(0,-1);

                    else if(k === '='){

                        try{

                            let q =
                                s
                                .replaceAll('×','*')
                                .replaceAll('÷','/')
                                .replaceAll('−','-');

                            if(
                                !/^[0-9+\-*/().\s]+$/.test(q)
                            )
                                throw 0;

                            s =
                                String(
                                    Function(
                                        'return ' + q
                                    )()
                                );

                        }catch{

                            s = 'Fehler';

                        }

                    }else{

                        s += k;

                    }

                    out();

                }
        );

}


/* TERMINAL */

function appTerminal(c){

    c.innerHTML =

        '<div class="terminal" id="term">' +

            '<div>' +
            'VOS Terminal 1.0 — Tippe ' +
            '<b>help</b> für Befehle.' +
            '</div>' +

            '<div class="termInput">' +

                '<span>' +
                esc(activeUser().name) +
                '@vos:~$&nbsp;' +
                '</span>' +

                '<input id="termIn" autocomplete="off">' +

            '</div>' +

        '</div>';

    const t = $('term');

    const inp = $('termIn');

    const line = s => {

        const d =
            document.createElement('div');

        d.className = 'termLine';

        d.textContent = s;

        t.insertBefore(
            d,
            inp.parentElement
        );

    };

    inp.onkeydown =
        e => {

            if(e.key !== 'Enter')
                return;

            const cmd =
                inp.value.trim();

            line(
                activeUser().name +
                '@vos:~$ ' +
                cmd
            );

            inp.value = '';

            if(!cmd) return;

            const p =
                cmd.split(' ');

            const base =
                p[0].toLowerCase();

            if(base === 'help'){

                line(
                    'help, clear, date, time, whoami, ' +
                    'apps, open <app>, echo <text>, ' +
                    'system, users, calc <ausdruck>'
                );

            }

            else if(base === 'clear'){

                t.querySelectorAll('.termLine')
                    .forEach(
                        x => x.remove()
                    );

            }

            else if(base === 'date'){

                line(
                    new Date()
                    .toLocaleDateString('de-DE')
                );

            }

            else if(base === 'time'){

                line(
                    new Date()
                    .toLocaleTimeString('de-DE')
                );

            }

            else if(base === 'whoami'){

                line(activeUser().name);

            }

            else if(base === 'apps'){

                line(
                    Object.entries(apps)
                    .map(
                        ([k,v]) =>
                            k + ' = ' + v[1]
                    )
                    .join('\n')
                );

            }

            else if(
                base === 'open' &&
                apps[p[1]]
            ){

                openApp(p[1]);

            }

            else if(base === 'echo'){

                line(
                    p.slice(1).join(' ')
                );

            }

            else if(base === 'system'){

                line(
                    'VOS • Browser • LocalStorage • ' +
                    navigator.platform
                );

            }

            else if(base === 'users'){

                line(
                    users.map(
                        u => u.name
                    ).join(', ')
                );

            }

            else if(base === 'calc'){

                try{

                    const q =
                        p
                        .slice(1)
                        .join('')
                        .replace(
                            /[^0-9+\-*/().]/g,
                            ''
                        );

                    line(
                        String(
                            Function(
                                'return ' + q
                            )()
                        )
                    );

                }catch{

                    line(
                        'Ungültiger Ausdruck'
                    );

                }

            }

            else{

                line(
                    'Befehl nicht gefunden: ' +
                    base
                );

            }

            t.scrollTop =
                t.scrollHeight;

        };

}

/* PAINT */

function appPaint(c){

    c.innerHTML =

        '<div class="paint">' +

            '<div class="paintTools">' +

                '<button id="pclear">⌫</button>' +

                '<button id="perase">◻</button>' +

                '<input id="pcolor" type="color" value="#111111">' +

                '<input id="psize" type="range" min="1" max="35" value="5">' +

            '</div>' +

            '<canvas class="paintCanvas" id="paintCanvas"></canvas>' +

        '</div>';

    const can = $('paintCanvas');

    const ctx = can.getContext('2d');

    function size(){

        can.width =
            Math.max(
                300,
                can.clientWidth * devicePixelRatio
            );

        can.height =
            Math.max(
                250,
                can.clientHeight * devicePixelRatio
            );

        ctx.scale(
            devicePixelRatio,
            devicePixelRatio
        );

        ctx.fillStyle = '#fff';

        ctx.fillRect(
            0,
            0,
            can.clientWidth,
            can.clientHeight
        );

    }

    setTimeout(
        size,
        30
    );

    let draw = false;

    let last;

    const pos = e => {

        const r =
            can.getBoundingClientRect();

        return {
            x:e.clientX-r.left,
            y:e.clientY-r.top
        };

    };

    can.onpointerdown =
        e => {

            draw = true;

            last = pos(e);

        };

    can.onpointerup =
        () => draw = false;

    can.onpointerleave =
        () => draw = false;

    can.onpointermove =
        e => {

            if(!draw) return;

            const p = pos(e);

            ctx.strokeStyle =
                $('perase').dataset.on
                ? '#fff'
                : $('pcolor').value;

            ctx.lineWidth =
                $('psize').value;

            ctx.lineCap =
                'round';

            ctx.beginPath();

            ctx.moveTo(
                last.x,
                last.y
            );

            ctx.lineTo(
                p.x,
                p.y
            );

            ctx.stroke();

            last = p;

        };

    $('perase').onclick =
        () => {

            $('perase').dataset.on =
                $('perase').dataset.on
                ? ''
                : '1';

            $('perase').textContent =
                $('perase').dataset.on
                ? '✏️'
                : '◻';

        };

    $('pclear').onclick =
        () => {

            ctx.fillStyle = '#fff';

            ctx.fillRect(
                0,
                0,
                can.clientWidth,
                can.clientHeight
            );

        };

}

/* SNAKE */

function appSnake(c){

    c.innerHTML =

        '<div class="gameWrap">' +

            '<div>' +

                '<div class="score">' +
                'Snake: ' +
                '<span id="snakeScore">0</span>' +
                '</div>' +

                '<canvas id="snakeC" class="gameCanvas" ' +
                'width="400" height="400"></canvas>' +

                '<p class="muted" style="text-align:center">' +
                'Pfeiltasten / WASD · Neustart mit Enter' +
                '</p>' +

            '</div>' +

        '</div>';

    const can = $('snakeC');

    const ctx = can.getContext('2d');

    const N = 20;

    const S = 20;

    let snake = [
        {
            x:10,
            y:10
        }
    ];

    let dir = {
        x:1,
        y:0
    };

    let food = {
        x:5,
        y:5
    };

    let score = 0;

    let running = true;

    const foodNew = () => {

        do{

            food = {
                x:Math.floor(Math.random()*N),
                y:Math.floor(Math.random()*N)
            };

        }while(
            snake.some(
                p =>
                    p.x === food.x &&
                    p.y === food.y
            )
        );

    };

    document.onkeydown =
        e => {

            const k =
                e.key.toLowerCase();

            if(k === 'enter'){

                snake = [
                    {
                        x:10,
                        y:10
                    }
                ];

                dir = {
                    x:1,
                    y:0
                };

                score = 0;

                running = true;

                return;

            }

            const m = {

                arrowup:[0,-1],
                w:[0,-1],

                arrowdown:[0,1],
                s:[0,1],

                arrowleft:[-1,0],
                a:[-1,0],

                arrowright:[1,0],
                d:[1,0]

            };

            if(m[k]){

                const [x,y] = m[k];

                if(
                    x !== -dir.x ||
                    y !== -dir.y
                ){

                    dir = {
                        x,
                        y
                    };

                }

            }

        };

    setInterval(
        () => {

            if(!running) return;

            let h = {

                x:
                    snake[0].x +
                    dir.x,

                y:
                    snake[0].y +
                    dir.y

            };

            if(
                h.x < 0 ||
                h.y < 0 ||
                h.x >= N ||
                h.y >= N ||
                snake.some(
                    p =>
                        p.x === h.x &&
                        p.y === h.y
                )
            ){

                running = false;

                return;

            }

            snake.unshift(h);

            if(
                h.x === food.x &&
                h.y === food.y
            ){

                score++;

                $('snakeScore').textContent =
                    score;

                foodNew();

            }else{

                snake.pop();

            }

        },
        110
    );

    setInterval(
        () => {

            ctx.fillStyle =
                '#05090d';

            ctx.fillRect(
                0,
                0,
                400,
                400
            );

            ctx.fillStyle =
                '#45ff9a';

            snake.forEach(
                p =>
                    ctx.fillRect(
                        p.x*S+1,
                        p.y*S+1,
                        S-2,
                        S-2
                    )
            );

            ctx.fillStyle =
                '#ff6078';

            ctx.beginPath();

            ctx.arc(
                food.x*S+10,
                food.y*S+10,
                7,
                0,
                Math.PI*2
            );

            ctx.fill();

        },
        40
    );

}


/* MINESWEEPER */

function appMines(c){

    c.innerHTML =

        '<div class="gameWrap">' +

            '<div>' +

                '<div class="score">' +
                'Minesweeper ' +
                '<span id="mineStatus">' +
                '12 Minen' +
                '</span>' +
                '</div>' +

                '<div class="mine" id="mineGrid"></div>' +

                '<p class="muted">' +
                'Linksklick öffnen · Rechtsklick Flagge' +
                '</p>' +

            '</div>' +

        '</div>';

    const grid = $('mineGrid');

    const N = 10;

    const M = 12;

    let cells = [];

    function start(){

        cells =
            Array.from(
                {
                    length:N*N
                },
                () => ({
                    mine:false,
                    open:false,
                    flag:false,
                    n:0
                })
            );

        let set = new Set();

        while(set.size < M)
            set.add(
                Math.floor(
                    Math.random()*N*N
                )
            );

        set.forEach(
            i =>
                cells[i].mine = true
        );

        for(let i=0;i<100;i++){

            let x = i % N;

            let y = Math.floor(i/N);

            cells[i].n =
                neighbors(x,y)
                .filter(
                    j => cells[j].mine
                ).length;

        }

        render();

    }

    function neighbors(x,y){

        let a = [];

        for(let dy=-1;dy<=1;dy++)
            for(let dx=-1;dx<=1;dx++){

                if(dx || dy){

                    let X = x + dx;

                    let Y = y + dy;

                    if(
                        X >= 0 &&
                        X < N &&
                        Y >= 0 &&
                        Y < N
                    ){

                        a.push(
                            Y*N+X
                        );

                    }

                }

            }

        return a;

    }

    function open(i){

        let q = [i];

        while(q.length){

            let j = q.pop();

            let v = cells[j];

            if(v.open || v.flag)
                continue;

            v.open = true;

            if(v.mine){

                cells.forEach(
                    x =>
                        x.open = x.mine
                );

                render();

                $('mineStatus').textContent =
                    '💥 verloren — Doppelklick zum Neustart';

                return;

            }

            if(v.n === 0){

                const x = j % N;

                const y = Math.floor(j/N);

                neighbors(x,y)
                    .forEach(
                        k => {

                            if(!cells[k].open)
                                q.push(k);

                        }
                    );

            }

        }

        render();

        if(
            cells.every(
                v => v.open || v.mine
            )
        ){

            $('mineStatus').textContent =
                '🎉 geschafft!';

        }

    }

    function render(){

        grid.innerHTML =
            cells.map(
                (v,i) =>

                    '<button class="' +

                    (
                        v.open
                        ? 'open '
                        : ''
                    ) +

                    (
                        v.flag
                        ? 'flag'
                        : ''
                    ) +

                    '" data-i="' +
                    i +
                    '">' +

                    (
                        v.open
                        ? (
                            v.mine
                            ? '💣'
                            : v.n || ''
                        )
                        : (
                            v.flag
                            ? '⚑'
                            : ''
                        )
                    ) +

                    '</button>'
            ).join('');

        grid.querySelectorAll('button')
            .forEach(
                b => {

                    b.onclick =
                        () =>
                            open(
                                +b.dataset.i
                            );

                    b.oncontextmenu =
                        e => {

                            e.preventDefault();

                            cells[
                                +b.dataset.i
                            ].flag =
                                !cells[
                                    +b.dataset.i
                                ].flag;

                            render();

                        };

                }
            );

    }

    grid.ondblclick = () => start();

    start();

}

            [0,1,2],

            [0,3,6],
            [1,4,7],
            [2,5,8],

            );

        const pick =
            empty[
                Math.floor(

                )
            ];

        if(win('O')){

            over = true;

            $('tttMsg').textContent =
                'O gewinnt';

        }

        else if(a.every(Boolean)){

            over = true;

            $('tttMsg').textContent =
                'Unentschieden';

        render();

    }

        () => {

            a = Array(9).fill('');

            over = false;

            $('tttMsg').textContent =
                'Du bist X';

            render();

        };

    let a = Array(16).fill(0);

    const add = () => {

        let e =
            a.map(
                (v,i) =>
                    v ? null : i
            )
            .filter(
                v => v !== null
            );

        if(e.length){

            a[
                e[
                    Math.floor(
                        Math.random() *
                        e.length
                    )
                ]
            ] = 2;

        }

    };

    const line = row => {

        row =
            row.filter(Boolean);

        for(
            let i=0;
            i<row.length-1;
            i++
        ){

            if(
                row[i] ===
                row[i+1]
            ){

                row[i] *= 2;

                score += row[i];

                row[i+1] = 0;

            }

        }

        row =
            row.filter(Boolean);

        while(row.length < 4)
            row.push(0);

        return row;

    };

    function move(dir){

        let old = a.join();

        if(
            dir === 'L' ||
            dir === 'R'
        ){

            for(
                let y=0;
                y<4;
                y++
            ){

                let r =
                    a.slice(
                        y*4,
                        y*4+4
                    );

                if(dir === 'R')
                    r.reverse();

                r = line(r);

                if(dir === 'R')
                    r.reverse();

                for(
                    let x=0;
                    x<4;
                    x++
                ){

                    a[
                        y*4+x
                    ] = r[x];

                }

            }

        }else{

            for(
                let x=0;
                x<4;
                x++
            ){

                let r = [
                    a[x],
                    a[x+4],
                    a[x+8],
                    a[x+12]
                ];

                if(dir === 'D')
                    r.reverse();

                r = line(r);

                if(dir === 'D')
                    r.reverse();

                for(
                    let y=0;
                    y<4;
                    y++
                ){

                    a[
                        y*4+x
                    ] = r[y];

                }

            }

        }

        if(a.join() !== old)
            add();

        render();

    }

    function render(){

        $('g2048').innerHTML =
            a.map(
                v =>
                    '<div>' +
                    (v || '') +
                    '</div>'
            ).join('');

        $('s2048').textContent =
            score;

    }

    document.onkeydown =
        e => {

            const m = {

                arrowleft:'L',
                a:'L',

                arrowright:'R',
                d:'R',

                arrowup:'U',
                w:'U',

                arrowdown:'D',
                s:'D'

            };

            const dir =
                m[
                    e.key.toLowerCase()
                ];

            if(dir)
                move(dir);

        };

    add();

    add();

    render();

}


/* CLICKER */

function appClicker(c){

    c.innerHTML =

        '<div class="gameWrap">' +

            '<div class="clicker">' +

                '<h2>VOS Clicker</h2>' +

                '<div>' +
                'Coins: ' +
                '<b id="coins">0</b>' +
                '</div>' +

                '<button class="clickCoin" id="coin">' +
                '◈' +
                '</button>' +

                '<div class="menuRow">' +

                    '<button class="btn" id="upgrade">' +
                    'Upgrade +1 · 25' +
                    '</button>' +

                    '<button class="btn" id="auto">' +
                    'Auto · 100' +
                    '</button>' +

                '</div>' +

                '<p class="muted">' +

                    'Power: ' +
                    '<span id="power">1</span>' +

                    ' · Auto: ' +

                    '<span id="autos">0</span>' +

                '</p>' +

            '</div>' +

        '</div>';

    let coins =
        Number(
            localStorage.getItem(
                key('coins')
            ) || 0
        );

    let power = 1;

    let auto = 0;

    function render(){

        $('coins').textContent =
            coins;

        $('power').textContent =
            power;

        $('autos').textContent =
            auto;

        localStorage.setItem(
            key('coins'),
            coins
        );

    }

    $('coin').onclick =
        () => {

            coins += power;

            render();

        };

    $('upgrade').onclick =
        () => {

            if(coins >= 25){

                coins -= 25;

                power++;

                render();

            }

        };

    $('auto').onclick =
        () => {

            if(coins >= 100){

                coins -= 100;

                auto++;

                render();

            }

        };

    setInterval(
        () => {

            if(auto){

                coins += auto;

                render();

            }

        },
        1000
    );

    render();

}


/* PONG */

function appPong(c){

    c.innerHTML =

        '<div class="gameWrap">' +

            '<div>' +

                '<div class="score">' +
                'Pong · ' +
                '<span id="pongScore">0</span>' +
                '</div>' +

                '<canvas id="pongC" class="gameCanvas" ' +
                'width="640" height="380"></canvas>' +

                '<p class="muted" style="text-align:center">' +
                'W/S oder ↑/↓' +
                '</p>' +

            '</div>' +

        '</div>';

    const can = $('pongC');

    const ctx = can.getContext('2d');

    let py = 150;

    let by = 170;

    let bx = 320;

    let vx = 4;

    let vy = 3;

    let score = 0;

    let keys = {};

    document.onkeydown =
        e =>
            keys[
                e.key.toLowerCase()
            ] = true;

    document.onkeyup =
        e =>
            keys[
                e.key.toLowerCase()
            ] = false;

    setInterval(
        () => {

            if(
                keys.w ||
                keys.arrowup
            )
                py -= 6;

            if(
                keys.s ||
                keys.arrowdown
            )
                py += 6;

            py =
                Math.max(
                    0,
                    Math.min(
                        300,
                        py
                    )
                );

            bx += vx;

            by += vy;

            if(
                by < 0 ||
                by > 360
            )
                vy *= -1;

            if(
                bx < 35 &&
                by > py &&
                by < py + 80
            )
                vx = Math.abs(vx);

            if(
                bx > 605 &&
                by > 150 &&
                by < 230
            )
                vx = -Math.abs(vx);

            if(bx < 0){

                score = 0;

                bx = 320;

                by = 170;

                vx = 4;

            }

            if(bx > 640){

                score++;

                bx = 320;

                by = 170;

                vx = -4;

            }

            $('pongScore').textContent =
                score;

            ctx.fillStyle =
                '#05090d';

            ctx.fillRect(
                0,
                0,
                640,
                380
            );

            ctx.strokeStyle =
                '#25414f';

            ctx.setLineDash([
                8,
                10
            ]);

            ctx.beginPath();

            ctx.moveTo(
                320,
                0
            );

            ctx.lineTo(
                320,
                380
            );

            ctx.stroke();

            ctx.setLineDash([]);

            ctx.fillStyle =
                '#45ff9a';

            ctx.fillRect(
                15,
                py,
                15,
                80
            );

            ctx.fillStyle =
                '#68a9ff';

            ctx.fillRect(
                610,
                150,
                15,
                80
            );

            ctx.fillStyle =
                '#fff';

            ctx.beginPath();

            ctx.arc(
                bx,
                by,
                8,
                0,
                Math.PI*2
            );

            ctx.fill();

        },
        16
    );

}
